<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-in</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/bee.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/checkin.css" />
</head>
<body class="checkin">

  <!-- ---------- identity + PIN gate ---------- -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <img src="assets/bee.svg" alt="" style="width:48px;height:48px;margin:0 auto .6rem" />
      <h1>Who's checking in?</h1>
      <p>Just the two of us.</p>
      <div class="who-row" id="who-row">
        <button class="who-btn" data-who="nama">
          <img src="assets/elephant.svg" alt="" /><b>Nama</b>
        </button>
        <button class="who-btn" data-who="you">
          <img src="assets/bee.svg" alt="" /><b>Me</b>
        </button>
      </div>
      <div class="pin-row" id="pin-row">
        <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off" />
      </div>
      <div class="gate-err" id="gate-err"></div>
      <button class="btn" id="enter-btn" disabled>Enter</button>
      <button class="gate-exit" id="gate-exit">← never mind</button>
    </div>
  </div>

  <!-- ---------- split status board ---------- -->
  <button class="leave" id="leave" aria-label="Back to site" title="Back to site">✕</button>

  <main class="split" id="board" hidden>
    <!-- Nama (elephant) -->
    <section class="pane pane-nama" data-side="nama">
      <img class="avatar" src="assets/elephant.svg" alt="Nama" />
      <div class="name">Nama <span class="dot" data-dot="nama"></span></div>
      <div class="status-bubble" data-status="nama">—</div>
      <div class="status-meta" data-meta="nama">No check-in yet</div>
      <div class="pane-me-actions" data-actions="nama" hidden>
        <button class="check-btn" data-open="nama">Check in</button>
        <div class="tap-hint">Tap to update your status</div>
      </div>
    </section>

    <!-- You (bee) -->
    <section class="pane pane-you" data-side="you">
      <img class="avatar" src="assets/bee.svg" alt="Me" />
      <div class="name">Me <span class="dot" data-dot="you"></span></div>
      <div class="status-bubble" data-status="you">—</div>
      <div class="status-meta" data-meta="you">No check-in yet</div>
      <div class="pane-me-actions" data-actions="you" hidden>
        <button class="check-btn" data-open="you">Check in</button>
        <div class="tap-hint">Tap to update your status</div>
      </div>
    </section>
  </main>

  <!-- ---------- preset sheet ---------- -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Check in">
    <button class="sheet-back" id="sheet-back" hidden>← back</button>
    <h2 id="sheet-title">How's it going?</h2>
    <div class="preset-list" id="preset-list"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/checkin.js"></script>
</body>
</html>
